<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Vertex AI Proxy</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <div id="loginCard" class="card mx-auto" style="max-width:420px;">

        <div class="card-header fw-bold">
            Admin Login
        </div>

        <div class="card-body">

            <input id="email" class="form-control mb-3" placeholder="Email">

            <input id="password" type="password" class="form-control mb-3" placeholder="Password">

            <button id="loginBtn" class="btn btn-primary w-100">
                Login
            </button>

        </div>

    </div>

    <div id="dashboard" style="display:none;">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h3 class="m-0">API Keys Dashboard</h3>

            <button class="btn btn-danger" id="logoutBtn">
                Logout
            </button>

        </div>

        <div class="card mb-3">

            <div class="card-body">

                <div class="row g-2">

                    <div class="col-md-8">
                        <input id="keyName" class="form-control" placeholder="Key Name">
                    </div>

                    <div class="col-md-4">
                        <button id="createBtn" class="btn btn-success w-100">
                            Create API Key
                        </button>
                    </div>

                </div>

            </div>

        </div>

        <div id="newKeyBox" class="alert alert-success" style="display:none;">

            <strong>Copy this key now. It won't be displayed again:</strong>

            <div class="input-group mt-2">

                <input id="newKey" class="form-control" readonly>

                <button id="copyBtn" class="btn btn-primary">
                    Copy
                </button>

            </div>

        </div>

        <div class="card mb-3">

            <div class="card-header fw-bold">
                Change Password
            </div>

            <div class="card-body">

                <div class="row g-2">

                    <div class="col-md-4">
                        <input id="currentPassword" type="password" class="form-control" placeholder="Current Password">
                    </div>

                    <div class="col-md-4">
                        <input id="newPassword" type="password" class="form-control" placeholder="New Password">
                    </div>

                    <div class="col-md-4">
                        <button id="changePasswordBtn" class="btn btn-warning w-100">
                            Change Password
                        </button>
                    </div>

                </div>

                <div id="passwordMsg" class="mt-2" style="display:none;"></div>

            </div>

        </div>
        <div class="alert alert-success loading">Loading ...</div>
        <div class="table-responsive">
            <table class="table table-bordered align-middle bg-white">

                <thead class="table-dark">

                <tr>
                    <th>Name</th>
                    <th>Requests</th>
                    <th>Prompt Tokens</th>
                    <th>Completion Tokens</th>
                    <th>Total Tokens</th>
                    <th>Last Used</th>
                    <th>Action</th>
                </tr>

                </thead>

                <tbody id="keysTable"></tbody>

            </table>
        </div>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>

let token = localStorage.getItem("jwt");

function headers() {

    return {
        Authorization: "Bearer " + token
    };

}

function showDashboard() {

    $("#loginCard").hide();
    $("#dashboard").show();

    loadKeys();

}

function showLogin() {

    $("#dashboard").hide();
    $("#loginCard").show();

}

if(token){

    showDashboard();

}

$("#loginBtn").click(function(){

    $.ajax({

        url:'/admin/login',
        method:'POST',
        contentType:'application/json',

        data:JSON.stringify({

            email:$("#email").val(),
            password:$("#password").val()

        }),

        success:function(r){

            token=r.token;

            localStorage.setItem("jwt",token);

            showDashboard();

        },

        error:function(){

            alert("Login failed");

        }

    });

});

$("#logoutBtn").click(function(){

    localStorage.removeItem("jwt");

    location.reload();

});

function loadKeys(){
    $('.loading').show()
    $.ajax({

        url:'/admin/api-keys',

        headers:headers(),

        success:function(keys){

            let html='';

            keys.forEach(function(key){

                const promptTokens = key.prompt_tokens || 0;
                const completionTokens = key.completion_tokens || 0;
                const totalTokens = promptTokens + completionTokens;

                html+=`
<tr>

<td class="fw-semibold">${key.name}</td>

<td><span class="badge bg-secondary">${key.request_count || 0}</span></td>

<td>${promptTokens.toLocaleString()}</td>

<td>${completionTokens.toLocaleString()}</td>

<td><span class="badge bg-primary fs-6">${totalTokens.toLocaleString()}</span></td>

<td>${key.last_used_at ? new Date(key.last_used_at._seconds ? key.last_used_at._seconds * 1000 : key.last_used_at).toLocaleString() : 'Never'}</td>

<td>

<button
class="btn btn-sm btn-outline-danger deleteBtn"
data-id="${key.id}">
Delete
</button>

</td>

</tr>
`;

            });

            $("#keysTable").html(html);
            $('.loading').hide()
        }

    });

}

$("#createBtn").click(function(){

    $.ajax({

        url:'/admin/api-keys',

        method:'POST',

        headers:headers(),

        contentType:'application/json',

        data:JSON.stringify({

            name:$("#keyName").val()

        }),

        success:function(r){

            $("#newKeyBox").show();

            $("#newKey").val(r.key);

            $("#keyName").val("");

            loadKeys();

        }

    });

});

$(document).on("click",".deleteBtn",function(){

    if(!confirm("Delete this key?")) return;

    $.ajax({

        url:'/admin/api-keys/'+$(this).data("id"),

        method:'DELETE',

        headers:headers(),

        success:function(){

            loadKeys();

        }

    });

});

$("#copyBtn").click(function(){

    navigator.clipboard.writeText($("#newKey").val());

});

$("#changePasswordBtn").click(function(){

    const currentPassword = $("#currentPassword").val();
    const newPassword = $("#newPassword").val();

    if (!currentPassword || !newPassword) {
        $("#passwordMsg")
            .removeClass("alert-success").addClass("alert alert-danger")
            .text("Both fields are required.")
            .show();
        return;
    }

    $.ajax({
        url:'/admin/password',
        method:'PUT',
        headers:headers(),
        contentType:'application/json',
        data:JSON.stringify({
            currentPassword: currentPassword,
            newPassword: newPassword
        }),
        success:function(){
            $("#passwordMsg")
                .removeClass("alert-danger").addClass("alert alert-success")
                .text("Password changed successfully.")
                .show();
            $("#currentPassword").val("");
            $("#newPassword").val("");
        },
        error:function(xhr){
            const msg = xhr.responseJSON?.error || "Failed to change password.";
            $("#passwordMsg")
                .removeClass("alert-success").addClass("alert alert-danger")
                .text(msg)
                .show();
        }
    });

});

</script>

</body>
</html>
