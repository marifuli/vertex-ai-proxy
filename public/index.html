<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Vertex AI Proxy</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <div id="loginCard" class="card mx-auto" style="max-width:420px;">

        <div class="card-header">
            Admin Login
        </div>

        <div class="card-body">

            <input id="email" class="form-control mb-3" placeholder="Email">

            <input id="password" type="password" class="form-control mb-3" placeholder="Password">

            <button id="loginBtn" class="btn btn-primary w-100">
                Login
            </button>

        </div>

    </div>

    <div id="dashboard" style="display:none;">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h3>API Keys</h3>

            <button class="btn btn-danger" id="logoutBtn">
                Logout
            </button>

        </div>

        <div class="card mb-3">

            <div class="card-body">

                <div class="row">

                    <div class="col-md-8">
                        <input id="keyName" class="form-control" placeholder="Key Name">
                    </div>

                    <div class="col-md-4">
                        <button id="createBtn" class="btn btn-success w-100">
                            Create API Key
                        </button>
                    </div>

                </div>

            </div>

        </div>

        <div id="newKeyBox" class="alert alert-success" style="display:none;">

            <strong>Copy this key now.</strong>

            <div class="input-group mt-2">

                <input id="newKey" class="form-control" readonly>

                <button id="copyBtn" class="btn btn-primary">
                    Copy
                </button>

            </div>

        </div>

        <table class="table table-bordered bg-white">

            <thead>

            <tr>
                <th>Name</th>
                <th>Requests</th>
                <th>Last Used</th>
                <th></th>
            </tr>

            </thead>

            <tbody id="keysTable"></tbody>

        </table>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>

let token = localStorage.getItem("jwt");

function headers() {

    return {
        Authorization: "Bearer " + token
    };

}

function showDashboard() {

    $("#loginCard").hide();
    $("#dashboard").show();

    loadKeys();

}

function showLogin() {

    $("#dashboard").hide();
    $("#loginCard").show();

}

if(token){

    showDashboard();

}

$("#loginBtn").click(function(){

    $.ajax({

        url:'/admin/login',
        method:'POST',
        contentType:'application/json',

        data:JSON.stringify({

            email:$("#email").val(),
            password:$("#password").val()

        }),

        success:function(r){

            token=r.token;

            localStorage.setItem("jwt",token);

            showDashboard();

        },

        error:function(){

            alert("Login failed");

        }

    });

});

$("#logoutBtn").click(function(){

    localStorage.removeItem("jwt");

    location.reload();

});

function loadKeys(){

    $.ajax({

        url:'/admin/api-keys',

        headers:headers(),

        success:function(keys){

            let html='';

            keys.forEach(function(key){

                html+=`
<tr>

<td>${key.name}</td>

<td>${key.request_count}</td>

<td>${key.last_used_at ?? 'Never'}</td>

<td>

<button
class="btn btn-sm btn-danger deleteBtn"
data-id="${key.id}">
Delete
</button>

</td>

</tr>
`;

            });

            $("#keysTable").html(html);

        }

    });

}

$("#createBtn").click(function(){

    $.ajax({

        url:'/admin/api-keys',

        method:'POST',

        headers:headers(),

        contentType:'application/json',

        data:JSON.stringify({

            name:$("#keyName").val()

        }),

        success:function(r){

            $("#newKeyBox").show();

            $("#newKey").val(r.key);

            $("#keyName").val("");

            loadKeys();

        }

    });

});

$(document).on("click",".deleteBtn",function(){

    if(!confirm("Delete this key?")) return;

    $.ajax({

        url:'/admin/api-keys/'+$(this).data("id"),

        method:'DELETE',

        headers:headers(),

        success:function(){

            loadKeys();

        }

    });

});

$("#copyBtn").click(function(){

    navigator.clipboard.writeText($("#newKey").val());

});

</script>

</body>
</html>
